# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
binds=SUPER,r,reload_config

# overview
binds=SUPER,o,toggleoverview

# menu and terminal
bind=SUPER,space,spawn,vicinae toggle
bind=SUPER,Return,spawn,ghostty
binds=SUPER,p,spawn,vicinae vicinae://launch/clipboard/history

# exit
binds=SUPER+Alt,m,quit
binds=SUPER,q,killclient

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
binds=SUPER,h,focusdir,left
bind=SUPER,Right,focusdir,right
binds=SUPER,l,focusdir,right
bind=SUPER,Up,focusdir,up
binds=SUPER,k,focusdir,up
bind=SUPER,Down,focusdir,down
binds=SUPER,j,focusdir,down

# swap window
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right

# switch window status
binds=SUPER,g,toggleglobal,
binds=ALT,Tab,togglejump,
binds=SUPER,v,togglefloating,
binds=SUPER,m,togglemaximizescreen,
binds=SUPER+SHIFT,f,togglefullscreen,
binds=ALT+SUPER,f,togglefakefullscreen,
binds=SUPER,s,minimized,
# binds=SUPER,o,toggleoverlay,
binds=SUPER+SHIFT,I,restore_minimized
binds=SUPER,z,toggle_scratchpad

# # scroller layout
# binds=ALT,e,set_proportion,1.0
# # binds=ALT,x,switch_proportion_preset,
# bind=alt+super+ctrl,Left,scroller_stack,left
# bind=alt+super+ctrl,Right,scroller_stack,right
# bind=alt+super+ctrl,Up,scroller_stack,up
# bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
binds=ALT+SUPER,Return,dwindle_toggle_split_direction

# switch layout
binds=SUPER,n,switch_layout

# tag switch
binds=SUPER,i,viewtoleft,0
binds=SUPER,Prior,viewtoleft,0
binds=SUPER,u,viewtoright,0
binds=SUPER,Next,viewtoright,0
# bind=ALT+SUPER,Left,tagtoleft,0
# bind=ALT+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# add window to group
bind=Alt+Super,Left,groupjoin,left
bind=Alt+Super,Right,groupjoin,right
bind=Alt+Super,Up,groupjoin,up
bind=Alt+Super,Down,groupjoin,down

# focus next/prev in group
binds=Alt,Left,groupfocus,prev
binds=Alt,Right,groupfocus,next

# remove from group
binds=Alt+Super,r,groupleave

# # monitor switch
# bind=alt+shift,Left,focusmon,left
# bind=alt+shift,Right,focusmon,right
# bind=SUPER+Alt,Left,tagmon,left
# bind=SUPER+Alt,Right,tagmon,right

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
binds=SUPER+CTRL,minus,resizewin,+0,-50
binds=SUPER+CTRL,equal,resizewin,+0,+50
binds=SUPER,equal,resizewin,+50,+0
binds=SUPER,minus,resizewin,-50,+0

# audio & brightness
bind=none,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume raise
bind=none,XF86AudioLowerVolume,spawn,swayosd-client --output-volume lower
bind=none,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bind=none,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise --device intel_backlight
bind=none,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower --device intel_backlight

# screenshot & screenrecord
# bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | swappy -f -
bind=NONE,Print,spawn,flameshot gui
bind=SUPER,Print,spawn,$HOME/.config/niri/scripts/screenrecord.sh
