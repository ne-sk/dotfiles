# window border
window.active.border.color: #a7c080
window.inactive.border.color: #dbbc7f

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #e67e80

# window titlebar background
window.active.title.bg.color: #a7c080
window.inactive.title.bg.color: #dbbc7f

window.active.label.text.color: #161616
window.inactive.label.text.color: #161616
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #2a2a2a

# window buttons
window.active.button.unpressed.image.color: #161616
window.inactive.button.unpressed.image.color: #161616

# menu
menu.border.color: #161616
menu.items.bg.color: #a7c080
menu.items.text.color: #161616
menu.items.active.bg.color: #dbbc7f
menu.items.active.text.color: #161616
menu.separator.color: #161616
menu.title.bg.color: #a7c080
menu.title.text.color: #161616

# on screen display (window-cycle dialog)
osd.bg.color: #a7c080
osd.border.color: #161616
osd.label.text.color: #161616
osd.window-switcher.preview.border.color: #57656c
