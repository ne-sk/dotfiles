# This tmux statusbar config was created by tmuxline.vim
# on Wed, 17 Mar 2021
# Original layout from https://github.com/folke/tokyonight.nvim
# Recolored to gruvbox-material (hard, dark)
set -g mode-style "fg=#a9b665,bg=#3c3836"
set -g message-style "fg=#a9b665,bg=#3c3836"
set -g message-command-style "fg=#a9b665,bg=#3c3836"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#a9b665"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#a9b665,bg=#1d2021"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#1d2021,bg=#a9b665,bold] #S #[fg=#a9b665,bg=#1d2021,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#1d2021,bg=#1d2021,nobold,nounderscore,noitalics]#[fg=#a9b665,bg=#1d2021] #{prefix_highlight} #[fg=#3c3836,bg=#1d2021,bold,nounderscore,noitalics]#[fg=#a9b665,bg=#3c3836] %Y-%m-%d  %I:%M %p #[fg=#a9b665,bg=#3c3836,nobold,nounderscore,noitalics]#[fg=#1d2021,bg=#a9b665,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#1d2021,bg=#1d2021,nobold,nounderscore,noitalics]#[fg=#a9b665,bg=#1d2021] #{prefix_highlight} #[fg=#3c3836,bg=#1d2021,bold,nounderscore,noitalics]#[fg=#a9b665,bg=#3c3836] %Y-%m-%d  %H:%M #[fg=#a9b665,bg=#3c3836,nobold,nounderscore,noitalics]#[fg=#1d2021,bg=#a9b665,bold] #h "
}
setw -g window-status-activity-style "underscore,fg=#a9b665,bg=#1d2021"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b665,bg=#1d2021"
setw -g window-status-format "#[fg=#1d2021,bg=#1d2021,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#1d2021,bg=#1d2021,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#1d2021,bg=#3c3836,nobold,nounderscore,noitalics]#[fg=#a9b665,bg=#3c3836,bold] #I  #W #F #[fg=#3c3836,bg=#1d2021,nobold,nounderscore,noitalics]"
# Requires tmux-plugins/tmux-prefix-highlight
set -g @prefix_highlight_output_prefix "#[fg=#7daea3]#[bg=#1d2021]#[fg=#1d2021]#[bg=#7daea3]"
set -g @prefix_highlight_output_suffix ""
